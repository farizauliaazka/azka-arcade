<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azka Arcade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* BACKGROUND */

body{
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
overflow-x:hidden;
}

/* ANIMATED STARS */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:stars 60s linear infinite;
}

@keyframes stars{
from{transform:translateY(0)}
to{transform:translateY(-1000px)}
}

/* HEADER */

header{
text-align:center;
padding:70px 20px 40px;
z-index:1;
}

header h1{
font-size:55px;
margin-bottom:10px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

header p{
color:#94a3b8;
font-size:18px;
}

/* GAME GRID */

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
width:90%;
max-width:900px;
z-index:1;
}

/* GAME CARD */

.card{
background:#1e293b;
padding:30px;
border-radius:16px;
text-align:center;
text-decoration:none;
color:white;
transition:0.25s;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
background:#0ea5e9;
box-shadow:0 0 25px #0ea5e9;
}

.card h2{
margin-bottom:10px;
}

.card p{
font-size:14px;
color:#cbd5f5;
}

/* MUSIC BUTTON */

#musicBtn{
position:fixed;
top:20px;
right:20px;
background:#0ea5e9;
border:none;
border-radius:50%;
width:45px;
height:45px;
font-size:20px;
cursor:pointer;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
z-index:2;
transition:0.2s;
}

#musicBtn:hover{
background:#38bdf8;
transform:scale(1.1);
}

/* FOOTER */

footer{
margin-top:60px;
padding-bottom:30px;
color:#64748b;
font-size:14px;
z-index:1;
}

/* MOBILE */

@media(max-width:600px){

header h1{
font-size:36px;
}

header p{
font-size:14px;
}

.games{
grid-template-columns:1fr;
gap:18px;
}

}

</style>

</head>

<body>

<button id="musicBtn">🔊</button>

<header>

<h1>🎮 AZKA ARCADE</h1>
<p>Mini Games Website by Fariz Aulia Azka</p>

</header>

<section class="games">

<a href="games/tic-tac-toe.html" class="card">
<h2>⭕ Tic Tac Toe</h2>
<p>Mainkan game klasik X dan O</p>
</a>

<a href="games/rps.html" class="card">
<h2>✊ Rock Paper Scissors</h2>
<p>Lawan komputer!</p>
</a>

<a href="games/memory.html" class="card">
<h2>🧠 Memory Game</h2>
<p>Uji ingatanmu</p>
</a>

<a href="games/snake.html" class="card">
<h2>🐍 Snake Game</h2>
<p>Kendalikan ular dan kumpulkan poin</p>
</a>

</section>

<footer>

<p>© 2026 Azka Arcade</p>

</footer>

<audio id="bgMusic" autoplay loop>
<source src="assets/sound/arcade.mp3" type="audio/mpeg">
</audio>

<script>

let music=document.getElementById("bgMusic");
let btn=document.getElementById("musicBtn");

document.body.addEventListener("click",()=>{
music.play().catch(()=>{});
},{once:true});

btn.onclick=function(){

if(music.paused){
music.play();
btn.innerHTML="🔊";
}else{
music.pause();
btn.innerHTML="🔇";
}

}

</script>

</body>
</html>
