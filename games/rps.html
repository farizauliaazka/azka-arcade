<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors | Azka Arcade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* BACKGROUND */

body{
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
text-align:center;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow-x:hidden;
}

/* STAR ANIMATION */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:stars 60s linear infinite;
z-index:-1;
}

@keyframes stars{
from{transform:translateY(0)}
to{transform:translateY(-1000px)}
}

/* TITLE */

h1{
font-size:45px;
margin-bottom:10px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* SUBTITLE */

.subtitle{
color:#94a3b8;
margin-bottom:30px;
}

/* SCOREBOARD */

.scoreboard{
display:flex;
gap:40px;
font-size:18px;
margin-bottom:30px;
}

/* CHOICES */

.choices{
display:flex;
gap:25px;
margin-bottom:30px;
flex-wrap:wrap;
justify-content:center;
}

.choice{
background:#1e293b;
padding:30px;
font-size:40px;
border-radius:15px;
cursor:pointer;
transition:0.25s;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.choice:hover{
transform:scale(1.15);
background:#0ea5e9;
box-shadow:0 0 15px #0ea5e9;
}

/* RESULT */

.result{
font-size:22px;
margin-bottom:20px;
color:#e2e8f0;
}

/* BUTTON */

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
background:#38bdf8;
}

/* BACK */

.back{
margin-top:20px;
color:#94a3b8;
text-decoration:none;
}

.back:hover{
color:white;
}

/* MOBILE */

@media(max-width:600px){

h1{
font-size:32px;
}

.choice{
padding:20px;
font-size:32px;
}

.scoreboard{
gap:20px;
}

}

</style>
</head>

<body>

<h1>✊ Rock Paper Scissors ✋</h1>
<p class="subtitle">Lawan komputer!</p>

<div class="scoreboard">
<div>Player: <span id="playerScore">0</span></div>
<div>Computer: <span id="computerScore">0</span></div>
</div>

<div class="choices">

<div class="choice" onclick="play('rock')">✊</div>
<div class="choice" onclick="play('paper')">✋</div>
<div class="choice" onclick="play('scissors')">✌️</div>

</div>

<div class="result" id="result">
Pilih salah satu!
</div>

<button onclick="resetScore()">Reset Score</button>

<a class="back" href="../index.html">⬅ Back to Azka Arcade</a>

<!-- AUDIO -->
<audio id="clickSound" src="../assets/sound/click.mp3"></audio>
<audio id="winSound" src="../assets/sound/win.mp3"></audio>

<script>

let playerScore=0;
let computerScore=0;

function play(player){

let click=document.getElementById("clickSound");
click.currentTime=0;
click.play();

const choices=["rock","paper","scissors"];
const computer=choices[Math.floor(Math.random()*3)];

let resultText="";

if(player===computer){

resultText="🤝 Draw! Computer juga pilih "+computer;

}

else if(

player==="rock" && computer==="scissors" ||
player==="paper" && computer==="rock" ||
player==="scissors" && computer==="paper"

){

playerScore++;

let win=document.getElementById("winSound");
win.currentTime=0;
win.play();

resultText="🎉 Kamu Menang! Computer pilih "+computer;

}

else{

computerScore++;
resultText="😢 Computer Menang! Computer pilih "+computer;

}

document.getElementById("playerScore").textContent=playerScore;
document.getElementById("computerScore").textContent=computerScore;

document.getElementById("result").textContent=resultText;

}

function resetScore(){

playerScore=0;
computerScore=0;

document.getElementById("playerScore").textContent=0;
document.getElementById("computerScore").textContent=0;

document.getElementById("result").textContent="Score direset. Main lagi!";

}

</script>

</body>
</html>
