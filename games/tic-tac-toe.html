<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe | Azka Arcade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* BACKGROUND */

body{
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
overflow-x:hidden;
}

/* STAR ANIMATION */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:stars 60s linear infinite;
z-index:-1;
}

@keyframes stars{
from{transform:translateY(0)}
to{transform:translateY(-1000px)}
}

/* TITLE */

h1{
font-size:45px;
margin-bottom:10px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* STATUS */

.status{
margin-bottom:20px;
font-size:18px;
color:#94a3b8;
}

/* BOARD */

.board{
display:grid;
grid-template-columns:repeat(3,120px);
gap:12px;
margin-bottom:25px;
}

/* CELL */

.cell{
width:120px;
height:120px;
background:#1e293b;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
cursor:pointer;
transition:0.2s;
box-shadow:0 8px 20px rgba(0,0,0,0.6);
}

.cell:hover{
background:#0ea5e9;
transform:scale(1.05);
box-shadow:0 0 15px #0ea5e9;
}

/* BUTTON */

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
background:#38bdf8;
}

/* BACK */

.back{
margin-top:20px;
display:inline-block;
color:#94a3b8;
text-decoration:none;
}

.back:hover{
color:white;
}

/* MOBILE */

@media(max-width:600px){

h1{
font-size:32px;
}

.board{
grid-template-columns:repeat(3,90px);
}

.cell{
width:90px;
height:90px;
font-size:35px;
}

}

</style>
</head>

<body>

<h1>⭕ Tic Tac Toe ❌</h1>

<div class="status" id="status">
Player X Turn
</div>

<div class="board" id="board"></div>

<button onclick="resetGame()">Reset Game</button>

<a class="back" href="../index.html">⬅ Back to Azka Arcade</a>

<!-- SOUND EFFECT -->
<audio id="clickSound" src="../assets/sound/click.mp3"></audio>
<audio id="winSound" src="../assets/sound/win.mp3"></audio>

<script>

let board=document.getElementById("board");
let statusText=document.getElementById("status");

let cells=[];
let currentPlayer="X";
let gameActive=true;

const winPatterns=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

for(let i=0;i<9;i++){

let cell=document.createElement("div");
cell.classList.add("cell");
cell.dataset.index=i;

cell.addEventListener("click",handleClick);

board.appendChild(cell);
cells.push(cell);

}

function handleClick(e){

let cell=e.target;

if(cell.textContent!=="" || !gameActive) return;

let click=document.getElementById("clickSound");
click.currentTime=0;
click.play();

cell.textContent=currentPlayer;

checkWinner();

currentPlayer=currentPlayer==="X"?"O":"X";

if(gameActive){
statusText.textContent="Player "+currentPlayer+" Turn";
}

}

function checkWinner(){

for(let pattern of winPatterns){

let a=cells[pattern[0]].textContent;
let b=cells[pattern[1]].textContent;
let c=cells[pattern[2]].textContent;

if(a && a===b && a===c){

statusText.textContent="🎉 Player "+a+" Wins!";

let win=document.getElementById("winSound");
win.currentTime=0;
win.play();

gameActive=false;
return;

}

}

let draw=cells.every(cell=>cell.textContent!=="");

if(draw){
statusText.textContent="🤝 Draw Game!";
gameActive=false;
}

}

function resetGame(){

cells.forEach(cell=>cell.textContent="");

currentPlayer="X";
gameActive=true;

statusText.textContent="Player X Turn";

}

</script>

</body>
</html>
