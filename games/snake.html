<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game | Azka Arcade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
text-align:center;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow-x:hidden;
}

/* STAR BACKGROUND */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:stars 60s linear infinite;
z-index:-1;
}

@keyframes stars{
from{transform:translateY(0)}
to{transform:translateY(-1000px)}
}

h1{
font-size:45px;
margin-bottom:10px;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.info{
color:#94a3b8;
margin-bottom:20px;
}

.score{
font-size:20px;
margin-bottom:15px;
}

/* GAME CANVAS */

canvas{
background:#1e293b;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

/* BUTTON */

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
background:#38bdf8;
}

/* MOBILE CONTROLS */

.controls{
margin-top:20px;
display:none;
flex-direction:column;
align-items:center;
gap:10px;
}

.controls div{
display:flex;
gap:10px;
}

.ctrl{
width:60px;
height:60px;
background:#1e293b;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

.ctrl:hover{
background:#0ea5e9;
}

/* BACK LINK */

.back{
margin-top:20px;
text-decoration:none;
color:#94a3b8;
}

.back:hover{
color:white;
}

/* MOBILE */

@media(max-width:600px){

h1{
font-size:32px;
}

canvas{
width:320px;
height:320px;
}

.controls{
display:flex;
}

}

</style>
</head>

<body>

<h1>🐍 Snake Game</h1>
<p class="info">Gunakan tombol panah atau kontrol layar</p>

<div class="score">
Score: <span id="score">0</span>
</div>

<canvas id="game" width="400" height="400"></canvas>

<button onclick="restartGame()">Restart</button>

<!-- MOBILE CONTROLS -->

<div class="controls">

<div>
<div class="ctrl" onclick="setDirection('up')">⬆</div>
</div>

<div>
<div class="ctrl" onclick="setDirection('left')">⬅</div>
<div class="ctrl" onclick="setDirection('down')">⬇</div>
<div class="ctrl" onclick="setDirection('right')">➡</div>
</div>

</div>

<a class="back" href="../index.html">⬅ Back to Azka Arcade</a>

<!-- AUDIO -->

<audio id="eatSound" src="../assets/sound/eat.mp3"></audio>
<audio id="winSound" src="../assets/sound/win.mp3"></audio>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const box=20;

let snake=[{x:200,y:200}];

let food={
x:Math.floor(Math.random()*20)*box,
y:Math.floor(Math.random()*20)*box
};

let dx=box;
let dy=0;

let score=0;

document.addEventListener("keydown",direction);

function direction(e){

if(e.key==="ArrowUp" && dy===0){
dx=0; dy=-box;
}
else if(e.key==="ArrowDown" && dy===0){
dx=0; dy=box;
}
else if(e.key==="ArrowLeft" && dx===0){
dx=-box; dy=0;
}
else if(e.key==="ArrowRight" && dx===0){
dx=box; dy=0;
}

}

/* MOBILE CONTROL */

function setDirection(dir){

if(dir==="up" && dy===0){
dx=0; dy=-box;
}

if(dir==="down" && dy===0){
dx=0; dy=box;
}

if(dir==="left" && dx===0){
dx=-box; dy=0;
}

if(dir==="right" && dx===0){
dx=box; dy=0;
}

}

function drawGame(){

ctx.fillStyle="#1e293b";
ctx.fillRect(0,0,400,400);

for(let i=0;i<snake.length;i++){

ctx.fillStyle=i===0?"#38bdf8":"#22c55e";

ctx.fillRect(
snake[i].x,
snake[i].y,
box,
box
);

}

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,box,box);

let snakeX=snake[0].x+dx;
let snakeY=snake[0].y+dy;

if(snakeX===food.x && snakeY===food.y){

let eat=document.getElementById("eatSound");
eat.currentTime=0;
eat.play();

score++;
document.getElementById("score").textContent=score;

food={
x:Math.floor(Math.random()*20)*box,
y:Math.floor(Math.random()*20)*box
};

if(score===20){

let win=document.getElementById("winSound");
win.currentTime=0;
win.play();

setTimeout(()=>{
alert("🎉 Kamu menang! Score: "+score);
},200);

}

}else{

snake.pop();

}

let newHead={
x:snakeX,
y:snakeY
};

if(

snakeX<0 || snakeY<0 ||
snakeX>=400 || snakeY>=400 ||
collision(newHead,snake)

){

clearInterval(game);

alert("Game Over! Score: "+score);

}

snake.unshift(newHead);

}

function collision(head,array){

for(let i=0;i<array.length;i++){
if(head.x===array[i].x && head.y===array[i].y){
return true;
}
}

return false;

}

function restartGame(){
location.reload();
}

let game=setInterval(drawGame,100);

</script>

</body>
</html>
